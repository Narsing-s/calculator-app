<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Calculator</title>

<style>
:root {
  --bg:#121212;
  --box:#1e1e1e;
  --text:#fff;
  --accent:#00e6e6;
}
.light {
  --bg:#f5f5f5;
  --box:#ffffff;
  --text:#000;
}

body {
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* Tabs */
.tabs {
  display:flex;
  gap:10px;
  margin-top:15px;
}
.tabs button {
  padding:8px 12px;
}

/* Hide pages */
.page { display:none; }
.active { display:block; }

.calculator {
  width:350px;
  background:var(--box);
  padding:15px;
  border-radius:15px;
  margin-top:10px;
}

/* Result preview (NEW ✅) */
.preview {
  width:100%;
  padding:6px;
  font-size:1.2em;
  color:#aaa;
  text-align:right;
}

/* Display */
.display {
  width:100%;
  font-size:2em;
  padding:10px;
  background:#333;
  color:white;
  border:none;
  border-radius:10px;
  text-align:right;
}

.buttons {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:10px;
}

button {
  padding:10px;
  border:none;
  border-radius:10px;
  background:#2c2c2c;
  color:white;
  cursor:pointer;
}

button:hover {
  background:var(--accent);
  color:black;
}

.panel {
  width:350px;
  margin-top:10px;
  background:var(--box);
  padding:10px;
  border-radius:10px;
  max-height:300px;
  overflow:auto;
}
</style>
</head>

<body>

<!-- Tabs -->
<div class="tabs">
  <button onclick="showPage('calc')">Calculator</button>
  <button onclick="showPage('historyPage')">History</button>
  <button onclick="showPage('settingsPage')">Settings</button>
</div>

<!-- CALCULATOR PAGE -->
<div id="calc" class="page active">
  <div class="calculator">
    <div id="preview" class="preview"></div>
    <input id="display" class="display" readonly>

    <div class="buttons">

      <button onclick="clearDisplay()">C</button>
      <button onclick="back()">⌫</button>
      <button onclick="append('%')">%</button>
      <button onclick="append('/')">/</button>
      <button onclick="sqrt()">√</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('*')">*</button>
      <button onclick="pow2()">x²</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('-')">-</button>
      <button onclick="pow3()">x³</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('+')">+</button>
      <button onclick="copy()">📋</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button onclick="calculate()">=</button>
      <button onclick="solve()">🧠</button>

      <button onclick="func('sin')">sin</button>
      <button onclick="func('cos')">cos</button>
      <button onclick="func('tan')">tan</button>
      <button onclick="func('log')">log</button>

    </div>
  </div>
</div>

<!-- HISTORY PAGE -->
<div id="historyPage" class="page">
  <div class="panel" id="history"></div>
</div>

<!-- SETTINGS PAGE -->
<div id="settingsPage" class="page">
  <div class="panel">
    <button onclick="toggleTheme()">🌙 Toggle Theme</button><br><br>
    <button onclick="clearHistory()">🗑 Clear History</button>
  </div>
</div>

<script>
let d = document.getElementById("display");
let preview = document.getElementById("preview");
let hist = document.getElementById("history");

// Load saved data
hist.innerHTML = localStorage.getItem("hist") || "";
if(localStorage.getItem("theme")==="light"){
  document.body.classList.add("light");
}

// Tabs
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// Input
function append(v){
  d.value += v;
  updatePreview();
}

function clearDisplay(){
  d.value="";
  preview.innerText="";
}

function back(){
  d.value = d.value.slice(0,-1);
  updatePreview();
}

// LIVE RESULT PREVIEW ✅
function updatePreview(){
  try {
    let res = Function("return " + d.value)();
    preview.innerText = "= " + res;
  } catch {
    preview.innerText = "";
  }
}

// Calculate
function calculate(){
  try {
    let exp = d.value;
    let res = Function("return " + exp)();
    d.value = res;
    preview.innerText="";
    saveHistory(exp + " = " + res);
  } catch {
    d.value="Error";
  }
}

// History
function saveHistory(text){
  let p=document.createElement("p");
  p.textContent=text;
  hist.prepend(p);
  localStorage.setItem("hist", hist.innerHTML);
}

function clearHistory(){
  hist.innerHTML="";
  localStorage.removeItem("hist");
}

// Scientific
function func(type){
  let x = parseFloat(d.value);
  if(isNaN(x)) return;
  let r;
  if(type==="sin") r=Math.sin(x);
  if(type==="cos") r=Math.cos(x);
  if(type==="tan") r=Math.tan(x);
  if(type==="log") r=Math.log10(x);
  d.value=r;
  saveHistory(`${type}(${x})=${r}`);
}

// Extras
function pow2(){ let x=parseFloat(d.value)||0; d.value=x*x; }
function pow3(){ let x=parseFloat(d.value)||0; d.value=x*x*x; }
function sqrt(){ d.value=Math.sqrt(parseFloat(d.value)||0); }

// Copy
function copy(){
  navigator.clipboard.writeText(d.value);
  alert("Copied!");
}

// Theme
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme",
    document.body.classList.contains("light")?"light":"dark"
  );
}

// AI Solver
function solve(){
  let exp=d.value;
  try{
    let result=Function("return "+exp)();
    alert("Expression: "+exp+"\nResult: "+result);
  } catch {
    alert("Cannot solve");
  }
}

// Keyboard
document.addEventListener("keydown", e=>{
  if(!isNaN(e.key)||"+-*/.%".includes(e.key)){
    append(e.key);
  }
  if(e.key==="Enter") calculate();
  if(e.key==="Backspace") back();
});
</script>

</body>
</html>
