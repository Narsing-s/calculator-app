<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SaaS Calculator Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
--bg:#020617;
--card:rgba(255,255,255,.08);
--text:white;
--accent:#22c55e;
}

.light{
--bg:#f1f5f9;
--card:white;
--text:#111827;
}


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}


body{

background:var(--bg);
color:var(--text);

min-height:100vh;

display:flex;

}


/* SIDEBAR */

.sidebar{

width:240px;

background:var(--card);

backdrop-filter:blur(15px);

padding:25px;

height:100vh;

}


.logo{

font-size:24px;
font-weight:bold;

color:var(--accent);

margin-bottom:40px;

}


.menu button{

width:100%;

margin:8px 0;

padding:12px;

border:none;

border-radius:12px;

background:transparent;

color:var(--text);

cursor:pointer;

text-align:left;

font-size:15px;

}


.menu button:hover{

background:var(--accent);

color:white;

}


/* MAIN */

.main{

flex:1;

padding:30px;

}


.topbar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

}


.toggle{

padding:10px 15px;

border-radius:20px;

border:none;

cursor:pointer;

}



/* PAGES */


.page{

display:none;

}


.active{

display:block;

}



.card{

background:var(--card);

backdrop-filter:blur(20px);

padding:25px;

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,.2);

}



/* CALCULATOR */


.display{

width:100%;

height:70px;

font-size:35px;

border:none;

border-radius:15px;

padding:15px;

margin-bottom:20px;

background:black;

color:#00ff99;

text-align:right;

}



.buttons{

display:grid;

grid-template-columns:repeat(5,1fr);

gap:10px;

}


.buttons button{

padding:15px;

border:none;

border-radius:15px;

cursor:pointer;

font-size:16px;

}



.buttons button:hover{

transform:scale(1.05);

background:var(--accent);

color:white;

}



/* CONVERTER */


input{

padding:12px;

border-radius:10px;

border:none;

margin:5px;

width:90%;

}



.action{

background:var(--accent);

color:white;

border:none;

padding:10px;

border-radius:10px;

cursor:pointer;

}



/* FOOTER */

.footer{

margin-top:30px;

font-size:13px;

opacity:.7;

}


@media(max-width:800px){

.sidebar{

display:none;

}

.main{

padding:15px;

}


.buttons{

grid-template-columns:repeat(4,1fr);

}

}

</style>

</head>


<body>



<div class="sidebar">

<div class="logo">
🚀 SaaS Calc
</div>


<div class="menu">

<button onclick="showPage('calc')">
🧮 Calculator
</button>

<button onclick="showPage('history')">
📜 History
</button>

<button onclick="showPage('chart')">
📊 Analytics
</button>

<button onclick="showPage('convert')">
🔄 Converter
</button>

<button onclick="showPage('extra')">
⚡ Tools
</button>


</div>

</div>




<div class="main">


<div class="topbar">

<h2>
Calculator Dashboard
</h2>


<button class="toggle" onclick="theme()">
🌙 Theme
</button>


</div>



<!-- CALCULATOR -->

<div id="calc" class="page active">

<div class="card">


<input id="display" class="display" readonly>


<div class="buttons">

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('/')">÷</button>
<button onclick="memoryAdd()">M+</button>


<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('*')">×</button>
<button onclick="memorySub()">M-</button>


<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('-')">-</button>
<button onclick="memoryRecall()">MR</button>


<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="calculate()">=</button>
<button onclick="add('+')">+</button>
<button onclick="memoryClear()">MC</button>


<button onclick="voice()">
🎤 Voice
</button>

</div>


</div>

</div>




<!-- HISTORY -->


<div id="history" class="page">

<div class="card">

<h3>Calculation History</h3>

<div id="historyData"></div>

<button class="action" onclick="clearHistory()">
Clear
</button>

</div>

</div>




<!-- CHART -->


<div id="chart" class="page">

<div class="card">

<h3>Usage Analytics</h3>

<canvas id="graph"></canvas>


</div>

</div>




<!-- CONVERTER -->


<div id="convert" class="page">

<div class="card">

<h3>Converter</h3>


<input id="cm" placeholder="Centimeter">

<button class="action" onclick="cmConvert()">
CM → Meter
</button>


<br>


<input id="kg" placeholder="Gram">

<button class="action" onclick="kgConvert()">
Gram → KG
</button>


<br>


<input id="temp" placeholder="Celsius">

<button class="action" onclick="tempConvert()">
°C → °F
</button>



<h3 id="result"></h3>


</div>

</div>




<!-- EXTRA -->

<div id="extra" class="page">

<div class="card">

<h3>BMI Calculator</h3>


<input id="weight" placeholder="Weight KG">


<input id="height" placeholder="Height Meter">


<button class="action" onclick="bmi()">
Calculate BMI
</button>


<h3 id="bmiResult"></h3>


</div>

</div>



<div class="footer">

Created by Narsings | SaaS Calculator Pro

</div>


</div>



<script>


let display=document.getElementById("display");

let memory=0;

let values=[];


function showPage(id){

document.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

}



function add(v){

display.value+=v;

}



function calculate(){

try{

let result=eval(display.value);

display.value=result;

values.push(result);

saveHistory(result);

updateChart();

}

catch{

display.value="Error";

}

}



function saveHistory(v){

let h=document.getElementById("historyData");

h.innerHTML="<p>✔ "+v+"</p>"+h.innerHTML;

}



function clearHistory(){

document.getElementById("historyData").innerHTML="";

}



function memoryAdd(){

memory+=Number(display.value||0);

}


function memorySub(){

memory-=Number(display.value||0);

}


function memoryRecall(){

display.value=memory;

}


function memoryClear(){

memory=0;

}



let chart=new Chart(
document.getElementById("graph"),
{

type:"line",

data:{

labels:[],

datasets:[{

label:"Calculations",

data:[],

borderColor:"#22c55e"

}]

}

});


function updateChart(){

chart.data.labels=values.map((x,i)=>i+1);

chart.data.datasets[0].data=values;

chart.update();

}



function theme(){

document.body.classList.toggle("light");

}



function cmConvert(){

result.innerHTML=cm.value/100+" Meter";

}


function kgConvert(){

result.innerHTML=kg.value/1000+" KG";

}


function tempConvert(){

result.innerHTML=(temp.value*9/5+32)+" °F";

}



function bmi(){

let b=weight.value/(height.value*height.value);

bmiResult.innerHTML="BMI : "+b.toFixed(2);

}



function voice(){

let r=new webkitSpeechRecognition();

r.onresult=function(e){

display.value+=e.results[0][0].transcript;

}

r.start();

}


</script>


</body>
</html>
