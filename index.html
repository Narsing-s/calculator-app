<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS Calculator Pro</title>

<style>
:root {
  --bg:#0f172a;
  --card:rgba(255,255,255,0.06);
  --text:#fff;
  --accent:#22c55e;
}
.light {
  --bg:#f5f5f5;
  --card:#fff;
  --text:#000;
}

body {
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.card {
  width:350px;
  background:var(--card);
  backdrop-filter:blur(10px);
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}

.tabs {
  display:flex;
  gap:10px;
  margin-top:10px;
}

.page { display:none; }
.active { display:block; }

.preview { text-align:right; color:#aaa; }

.display {
  width:100%;
  font-size:2em;
  padding:10px;
  background:#111;
  border:none;
  border-radius:10px;
  color:white;
  text-align:right;
}

.buttons {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

button {
  padding:10px;
  border:none;
  border-radius:10px;
  background:#1e293b;
  color:white;
  cursor:pointer;
}
button:hover {
  background:var(--accent);
  color:black;
}

.panel {
  max-height:250px;
  overflow:auto;
}

.footer {
  margin:20px;
  font-size:12px;
  opacity:0.7;
}
.footer a {
  color:var(--accent);
  text-decoration:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="card">
  <h2>Login</h2>
  <input id="username" placeholder="Enter username" style="width:100%;padding:10px"><br><br>
  <button onclick="login()">Enter</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <div class="tabs">
    <button onclick="showPage('calc')">Calculator</button>
    <button onclick="showPage('historyPage')">History</button>
    <button onclick="showPage('settingsPage')">Settings</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- CALCULATOR -->
  <div id="calc" class="page active">
    <div class="card">
      <div id="preview" class="preview"></div>
      <input id="display" class="display" readonly>

      <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="back()">⌫</button>
        <button onclick="append('%')">%</button>
        <button onclick="append('/')">/</button>
        <button onclick="sqrt()">√</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('*')">*</button>
        <button onclick="pow2()">x²</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('-')">-</button>
        <button onclick="pow3()">x³</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('+')">+</button>
        <button onclick="copy()">Copy</button>

        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button onclick="calculate()">=</button>
        <button onclick="solve()">Solve</button>

        <button onclick="func('sin')">sin</button>
        <button onclick="func('cos')">cos</button>
        <button onclick="func('tan')">tan</button>
        <button onclick="func('log')">log</button>
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="historyPage" class="page">
    <div class="card panel" id="history"></div>
    <button onclick="exportHistory()">Export History</button>
  </div>

  <!-- SETTINGS -->
  <div id="settingsPage" class="page">
    <div class="card">
      <button onclick="toggleTheme()">Toggle Theme</button><br><br>
      <button onclick="clearHistory()">Clear History</button>
    </div>
  </div>

</div>

<!-- ✅ FIXED FOOTER -->
<div class="footer">
  Created by Narsings |
  <a href="https://github.com/Narsing-s/calculator-app/blob/main/index.html" target="_blank">
    calculator-api
  </a>
</div>

<script>
let d=document.getElementById("display");
let p=document.getElementById("preview");
let hist=document.getElementById("history");

let user=null;

// Auto login
if(localStorage.getItem("user")){
  user=localStorage.getItem("user");
  showApp();
}

function login(){
  let name=document.getElementById("username").value.trim();
  if(!name) return alert("Enter username");

  user=name;
  localStorage.setItem("user",user);
  showApp();
}

function logout(){
  localStorage.removeItem("user");
  user=null;

  document.getElementById("app").style.display="none";
  document.getElementById("loginPage").style.display="block";
}

function showApp(){
  document.getElementById("loginPage").style.display="none";
  document.getElementById("app").style.display="block";
  loadHistory();
}

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// History
function loadHistory(){
  hist.innerHTML = localStorage.getItem("hist_"+user) || "";
}

function saveHistory(text){
  let node=document.createElement("p");
  node.textContent=text;
  hist.prepend(node);
  localStorage.setItem("hist_"+user, hist.innerHTML);
}

// ✅ FIXED
function clearHistory(){
  localStorage.removeItem("hist_"+user);
  hist.innerHTML="";
  alert("History Cleared!");
}

// Calculator
function append(v){ d.value+=v; preview(); }
function clearDisplay(){ d.value=""; p.innerText=""; }
function back(){ d.value=d.value.slice(0,-1); preview(); }

function preview(){
  try{ p.innerText="= "+Function("return "+d.value)(); }
  catch{ p.innerText=""; }
}

function calculate(){
  try{
    let exp=d.value;
    let res=Function("return "+exp)();
    d.value=res;
    p.innerText="";
    saveHistory(exp+" = "+res);
  }catch{ d.value="Error"; }
}

function func(t){
  let x=parseFloat(d.value);
  if(isNaN(x)) return;
  let r=Math[t==="log"?"log10":t](x);
  d.value=r;
  saveHistory(`${t}(${x})=${r}`);
}

function sqrt(){ d.value=Math.sqrt(parseFloat(d.value)||0); }
function pow2(){ let x=parseFloat(d.value)||0; d.value=x*x; }
function pow3(){ let x=parseFloat(d.value)||0; d.value=x*x*x; }

function copy(){
  navigator.clipboard.writeText(d.value);
  alert("Copied!");
}

function exportHistory(){
  let blob=new Blob([hist.innerText],{type:"text/plain"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=user+"_history.txt";
  a.click();
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

function solve(){
  try{
    let res=Function("return "+d.value)();
    alert("Result: "+res);
  }catch{
    alert("Error");
  }
}

document.addEventListener("keydown", e=>{
  if(!isNaN(e.key)||"+-*/.%".includes(e.key)) append(e.key);
  if(e.key==="Enter") calculate();
  if(e.key==="Backspace") back();
});
</script>

</body>
</html>
