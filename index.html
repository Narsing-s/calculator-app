<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS Calculator Pro</title>

<!-- ✅ Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --bg:#0f172a;
  --card:#1e293b;
  --text:#fff;
}
.light {
  --bg:#f5f5f5;
  --card:#fff;
  --text:#000;
}

body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.card{
  width:350px;
  background:var(--card);
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}

.tabs{display:flex;gap:8px;flex-wrap:wrap}

.page{display:none}
.active{display:block}

.display{
  width:100%;
  font-size:2em;
  padding:10px;
  text-align:right;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

button{
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.footer{
  margin:20px;
  font-size:12px;
}
.footer a{color:green}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="card">
  <h3>Login</h3>
  <input id="username" placeholder="Enter name" style="width:100%;padding:10px">
  <br><br>
  <button onclick="login()">Enter</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="tabs">
<button onclick="showPage('calc')">Calc</button>
<button onclick="showPage('historyPage')">History</button>
<button onclick="showPage('chartPage')">Chart</button>
<button onclick="showPage('convertPage')">Convert</button>
<button onclick="showPage('extrasPage')">Extras</button>
<button onclick="logout()">Logout</button>
</div>

<!-- CALC -->
<div id="calc" class="page active">
<div class="card">

<input id="display" class="display" readonly>

<div class="buttons">
<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('+')">+</button>
<button onclick="mAdd()">M+</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="append('-')">-</button>
<button onclick="mSub()">M-</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="append('*')">*</button>
<button onclick="mRecall()">MR</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="calculate()">=</button>
<button onclick="append('/')">/</button>
<button onclick="mClear()">MC</button>

<button onclick="startVoice()">🎤</button>
</div>
</div>
</div>

<!-- HISTORY -->
<div id="historyPage" class="page">
<div class="card" id="history"></div>
<button onclick="clearHistory()">Clear History</button>
</div>

<!-- CHART -->
<div id="chartPage" class="page">
<div class="card">
<canvas id="chart"></canvas>
</div>
</div>

<!-- CONVERTER -->
<div id="convertPage" class="page">
<div class="card">

<h4>Length</h4>
<input id="cm" placeholder="CM">
<button onclick="cmToM()">→ M</button>
<button onclick="cmToKm()">→ KM</button>

<h4>Weight</h4>
<input id="g" placeholder="Grams">
<button onclick="gToKg()">→ KG</button>

<h4>Temperature</h4>
<input id="c" placeholder="Celsius">
<button onclick="cToF()">→ F</button>

<h4>Currency</h4>
<input id="inr" placeholder="INR">
<button onclick="inrToUsd()">→ USD</button>

<p id="result"></p>
</div>
</div>

<!-- EXTRA -->
<div id="extrasPage" class="page">
<div class="card">
<h4>BMI</h4>
<input id="weight" placeholder="Weight (kg)">
<input id="height" placeholder="Height (m)">
<button onclick="calcBMI()">Calculate</button>
<p id="bmiResult"></p>
</div>
</div>

</div>

<!-- FOOTER -->
<div class="footer">
Created by Narsings |
<a href="https://github.com/Narsing-s/calculator-app" target="_blank">
calculator-api
</a>
</div>

<script>
let d=document.getElementById("display");
let hist=document.getElementById("history");

let user=null;
let memory=0;
let chartData=[];

// ✅ Chart
let chart=new Chart(document.getElementById("chart"),{
 type:'line',
 data:{labels:[],datasets:[{data:[],borderColor:'green'}]}
});

// ✅ LOGIN
function login(){
 let name=username.value.trim();
 if(!name) return alert("Enter name");
 user=name;
 localStorage.setItem("user",user);
 showApp();
}

if(localStorage.getItem("user")){
 user=localStorage.getItem("user");
 showApp();
}

// ✅ LOGOUT FIX
function logout(){
 user=null;
 localStorage.removeItem("user");
 document.getElementById("app").style.display="none";
 document.getElementById("loginPage").style.display="block";
}

// ✅ SHOW APP
function showApp(){
 loginPage.style.display="none";
 app.style.display="block";
 loadHistory();
}

// ✅ NAV
function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

// ✅ CALC
function append(v){ d.value+=v }
function calculate(){
 try{
 let res=Function("return "+d.value)();
 d.value=res;
 saveHistory(res);
 updateChart(res);
 }catch{ d.value="Error" }
}

// ✅ HISTORY
function loadHistory(){
 hist.innerHTML=localStorage.getItem("hist_"+user)||"";
}
function saveHistory(val){
 let p=document.createElement("p");
 p.textContent=val;
 hist.prepend(p);
 localStorage.setItem("hist_"+user,hist.innerHTML);
}
function clearHistory(){
 localStorage.removeItem("hist_"+user);
 hist.innerHTML="";
}

// ✅ MEMORY
function mAdd(){memory+=Number(d.value||0)}
function mSub(){memory-=Number(d.value||0)}
function mRecall(){d.value=memory}
function mClear(){memory=0}

// ✅ CHART
function updateChart(val){
 chartData.push(val);
 chart.data.labels=chartData.map((_,i)=>i+1);
 chart.data.datasets[0].data=chartData;
 chart.update();
}

// ✅ VOICE
function startVoice(){
 let rec=new(window.SpeechRecognition||webkitSpeechRecognition)();
 rec.onresult=e=>{
  d.value+=e.results[0][0].transcript;
 };
 rec.start();
}

// ✅ CONVERSIONS
function cmToM(){result.innerText=cm.value/100+" m"}
function cmToKm(){result.innerText=cm.value/100000+" km"}
function gToKg(){result.innerText=g.value/1000+" kg"}
function cToF(){result.innerText=(c.value*9/5+32)+" F"}
function inrToUsd(){result.innerText=(inr.value/83).toFixed(2)+" USD"}

// ✅ BMI
function calcBMI(){
 let w=weight.value;
 let h=height.value;
 bmiResult.innerText=(w/(h*h)).toFixed(2);
}
</script>

</body>
</html>
